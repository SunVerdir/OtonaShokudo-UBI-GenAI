<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OtonaShokudo-UBI-GenAI Prototype</title>
    <!-- stlite（最新安定版）の読み込み -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["pandas", "numpy"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "app.py"
            }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
